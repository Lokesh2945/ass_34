<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Classes</title>
</head>
<body>

    <h1>JavaScript Classes Examples</h1>

    <script>


// 1. calculate

function calculate(a, b, callback) {
    return callback(a, b);
}

function add(x, y) {
    return x + y;
}

console.log("1. Addition:", calculate(10, 20, add));


// 2. greetUser

function greetUser(name, callback) {
    callback(name);
}

function welcome(name) {
    console.log("2. Welcome " + name + "!");
}

greetUser("Lokesh", welcome);


// 3. processArray

function processArray(arr, callback) {
    return arr.map(callback);
}

function doubleNumber(num) {
    return num * 2;
}

console.log("3. Doubled Array:", processArray([1, 2, 3, 4, 5], doubleNumber));


// 4. filterNumbers

function filterNumbers(arr, callback) {
    return arr.filter(callback);
}

function isPositive(num) {
    return num > 0;
}

console.log("4. Positive Numbers:", filterNumbers([-5, 10, -2, 20, 0, 15], isPositive));


// 5. findNumber

function findNumber(arr, callback) {
    return arr.find(callback);
}

function isEven(num) {
    return num % 2 === 0;
}

console.log("5. First Even Number:", findNumber([1, 3, 7, 8, 10, 12], isEven));


// 6. removeNegative

function removeNegative(arr, callback) {
    return arr.filter(callback);
}

function notNegative(num) {
    return num >= 0;
}

console.log("6. After Removing Negative Values:",
    removeNegative([-10, 20, -5, 30, 40, -2], notNegative)
);


// 7. checkEligibility

function checkEligibility(age, callback) {
    callback(age);
}

function voteCheck(age) {
    if (age >= 18) {
        console.log("7. Eligible to vote");
    } else {
        console.log("7. Not eligible to vote");
    }
}

checkEligibility(20, voteCheck);


// 8. orderFood

function orderFood(callback) {
    setTimeout(function () {
        callback();
    }, 3000);
}

function foodReady() {
    console.log("8. Food is ready");
}

console.log("8. Ordering food...");
orderFood(foodReady);


// 9. sumArray

function sumArray(arr, callback) {
    return callback(arr);
}

function calculateSum(arr) {
    let sum = 0;

    for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
    }

    return sum;
}

console.log("9. Total Sum:", sumArray([10, 20, 30, 40], calculateSum));


// 10. sortArray

function sortArray(arr, callback) {
    return callback(arr);
}

function ascendingSort(arr) {
    return arr.sort(function (a, b) {
        return a - b;
    });
}

console.log("10. Ascending Order:",
    sortArray([50, 10, 40, 20, 30], ascendingSort)
);


 </script>

</body>
</html>
